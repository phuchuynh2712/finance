name: finance
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database (Offline-First Data & Sync)
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # Local ID generation for Drift rows (was already an undeclared transitive
  # dependency via other packages; declared explicitly since repository
  # implementations import it directly)
  uuid: ^4.5.1

  # Supabase backend
  supabase_flutter: ^2.8.0

  # Environment config
  # Routing
  go_router: ^14.6.2

  # Locale-aware formatting (currency, date, number)
  intl: ^0.20.2

  # Secure storage for tokens/secrets
  flutter_secure_storage: ^9.2.2

  # Icon library (single consistent icon set across the app)
  lucide_icons: ^0.257.0

  # Biometric (fingerprint/Face ID) quick login
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3

  # Was already an undeclared transitive dependency via drift/drift_flutter;
  # declared explicitly since the v2→v3 migration integration test seeds a
  # raw SQLite fixture directly (spec.md SC-007)
  sqlite3: ^2.9.4

  # App icon and splash screen generation (dev-time only, no runtime dependency)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml)
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon/appicon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # UI font (Lexend), bundled locally rather than fetched at runtime via the
  # google_fonts package — keeps cold start/offline-first behavior reliable
  # (research.md §8). Upstream only ships Lexend as a single variable font
  # (no static per-weight files exist in the google/fonts source repo) — one
  # asset entry is correct; Flutter/Skia resolves FontWeight.w400/600/700/800
  # from the font's own wght axis at render time, no per-weight files needed.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/appicon.png"
  adaptive_icon_background: "assets/icon/appicon_background.png"
  adaptive_icon_foreground: "assets/icon/appicon_foreground.png"
  # appicon_foreground.svg already precisely scales the motif to fit within
  # Android's 66x66dp safe zone (transparent padding baked into the 108x108
  # canvas, computed and verified in research.md §2). The tool's default 16%
  # inset would double-shrink it on top of that, so it's disabled here.
  adaptive_icon_foreground_inset: 0
  # The source SVG has no transparent regions (the background rect fills the
  # full canvas), so removing alpha loses nothing visually while satisfying
  # Apple's App Store requirement that the 1024x1024 marketing icon be opaque.
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FAF8F5"
  color_dark: "#1A1714"
  image: "assets/icon/appicon.png"
  android: true
  ios: true
  # Web/desktop are out of scope for this feature (spec.md Assumptions);
  # web defaults to enabled unless explicitly disabled.
  web: false
  android_12:
    # Android 12+ clips this image to a circle and draws icon_background_color
    # behind it. Using the foreground-only motif (transparent bg) here made
    # the brand's gold icon background disappear, replaced by the flat
    # cream/black app background. Using the full flat icon (which already
    # bakes in the gold background, same as the launcher icon) keeps the
    # brand background visible on the Android 12+ splash too.
    image: "assets/icon/appicon.png"
    icon_background_color: "#DFB04A"
    icon_background_color_dark: "#DFB04A"
