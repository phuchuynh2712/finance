org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project (E:\) and the pub cache / Gradle caches (C:\) live on different
# drives, which crashes Kotlin's incremental compiler (relativeTo() cannot
# compute a relative path across drive roots — surfaced as "this and base
# files have different roots" when compiling google_sign_in_android's Kotlin
# sources). Disabling incremental compilation avoids that crash entirely.
kotlin.incremental=false
